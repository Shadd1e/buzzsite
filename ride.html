<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ride with Buzz</title>
<meta name="description" content="Deliver for Buzz sellers. Seven short questions, one at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231C7BEA'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23D2FF4D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--sky:#1C7BEA;--lime:#D2FF4D;--ink:#0A0A0A;--f:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;font:400 17px/1.5 var(--f);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}svg{display:block}button{font-family:inherit}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--lime);outline-offset:4px;border-radius:8px}
.mono{font:500 12px/1 var(--m);letter-spacing:.12em;text-transform:uppercase}
.pg{margin:8px;min-height:calc(100vh - 16px);min-height:calc(100dvh - 16px);border-radius:30px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(34% 12% at 6% 104%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 72%),radial-gradient(34% 12% at 96% 102%,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 72%),linear-gradient(180deg,#0E6CE0 0,#1F83EC 55%,#4FA6F4 100%)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:28px;letter-spacing:-.05em;color:#fff;--ac:#1C7BEA}.logo svg{width:28px;height:32px}
.links{display:flex;gap:34px}.links a{opacity:.92}.links a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:13px 22px;cursor:pointer}
.pill .dot{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;margin:-8px -14px -8px 0}.pill .dot .i{width:14px;height:14px;stroke-width:2.2}
.pill.lg{padding:18px 28px;font-size:13px}
.route{display:flex;align-items:center;padding:6px 26px 0;position:relative;z-index:2}
.route i{flex:none;width:12px;height:12px;border-radius:50%;border:2.5px solid rgba(255,255,255,.6);transition:all .3s}
.route b{flex:1;height:2.5px;background:rgba(255,255,255,.28);position:relative}
.route b::after{content:"";position:absolute;inset:0;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.route i.on{border-color:var(--lime);background:var(--lime)}.route b.on::after{transform:scaleX(1)}
.route i.now{box-shadow:0 0 0 6px rgba(210,255,77,.28)}
.route i:last-child{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
main{flex:1;display:flex;align-items:center;padding:30px 26px 90px;position:relative;z-index:2}
.step{max-width:900px;animation:in .45s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.say{min-height:26px;margin:0 0 10px;color:var(--lime);font-weight:500;font-size:17px}
.cnt{color:rgba(255,255,255,.75);margin-bottom:12px}
h1{margin:0 0 18px;font-weight:500;font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:1;letter-spacing:-.055em}
.why{color:rgba(255,255,255,.88);font-size:clamp(1.05rem,2vw,1.3rem);max-width:30em;margin:0 0 38px}
input,textarea{font:500 clamp(1.6rem,4vw,2.6rem)/1.3 var(--f);letter-spacing:-.03em;width:100%;color:#fff;background:transparent;border:0;border-bottom:3px solid #fff;border-radius:0;padding:10px 0 12px;caret-color:var(--lime)}
textarea{min-height:120px;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.5)}
input:focus,textarea:focus{outline:0;border-color:var(--lime)}
.opts{border-top:1.5px solid rgba(255,255,255,.35)}
.opt{width:100%;font:500 clamp(1.5rem,3.8vw,2.4rem)/1.2 var(--f);letter-spacing:-.04em;text-align:left;color:#fff;background:none;border:0;border-bottom:1.5px solid rgba(255,255,255,.35);padding:20px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:color .15s,padding .2s}
.opt .i{width:26px;height:26px;color:var(--lime);opacity:0;transform:translateX(-10px);transition:all .2s}
.opt:hover,.opt.sel{color:var(--lime);padding-left:14px}.opt:hover .i,.opt.sel .i{opacity:1;transform:none}
.row{display:flex;align-items:center;gap:24px;margin-top:34px;flex-wrap:wrap}
.lnk{background:none;border:0;color:#fff;cursor:pointer;padding:10px 2px;text-decoration:underline;text-underline-offset:5px}
.msg{min-height:24px;margin:14px 0 0;font-size:15px;font-weight:500;color:#FFE08A}
.dl{margin:8px 0 0;max-width:560px}
.dl div{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1.5px solid rgba(255,255,255,.35)}
.dl dt{color:rgba(255,255,255,.75)}.dl dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.fine{color:rgba(255,255,255,.8);font-size:14px;margin:22px 0 0}
.trail{position:absolute;right:0;bottom:30px;width:min(620px,80vw);z-index:1;pointer-events:none;opacity:.7}
@media(max-width:780px){.links{display:none}.nav{padding:18px}.route{padding:6px 18px 0}main{padding:24px 18px 90px;align-items:flex-start}.trail{opacity:.35}}
@media(prefers-reduced-motion:reduce){.step{animation:none}.route i,.route b::after,.opt,.opt .i{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="mark" viewBox="0 0 40 46"><rect x="3" y="0" width="11" height="40" rx="5.500" fill="currentColor"/><circle cx="23" cy="28" r="15" style="fill:var(--ac,#1C7BEA)"/><circle cx="23" cy="28" r="15" fill="none" stroke="currentColor" stroke-width="3.500"/><path d="M19 21.500l9.500 6.500-9.500 6.500z" fill="#fff"/></symbol>
<symbol id="go" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
</defs></svg>
<div class="pg">
  <div class="nav"><a class="logo" href="index.html" aria-label="Buzz home"><svg><use href="#mark"/></svg>buzz</a>
    <nav class="links mono"><a href="ride.html">Ride with Buzz</a><a href="help.html">Help</a><a href="privacy.html">Privacy</a></nav>
    <a class="pill mono" href="index.html">Back to home <span class="dot"><svg class="i"><use href="#go"/></svg></span></a></div>
  <div class="route" id="route" aria-hidden="true"></div>
  <svg class="trail" viewBox="0 0 640 300" fill="none" aria-hidden="true"><path d="M0 270C120 270 150 160 280 170s170 90 270 20 90-120 120-150" stroke="#fff" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/><circle cx="548" cy="188" r="9" fill="#D2FF4D"/><circle cx="548" cy="188" r="18" fill="#D2FF4D" opacity=".3"/></svg>
  <main><div id="stage"></div></main>
</div>
<script>
(function(){
"use strict";
/* Preview only: answers stay on this page. Nothing is sent or saved. */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var S=[
{k:"name",q:"What should we call you?",n:"So we know who we’re talking to.",t:"text",ph:"Your first name is fine",ack:function(v){return "Nice to meet you, "+v.split(" ")[0]+"."}},
{k:"phone",q:"What’s your phone number?",n:"It’s how we’ll reach you, by call or WhatsApp.",t:"tel",ph:"0803 000 0000",ack:"Great, now we know how to reach you."},
{k:"area",q:"Which area can you ride in?",n:"We start where Buzz sellers are busiest.",t:"text",ph:"e.g. Yaba, Lagos",ack:"Good. That tells us where to look first."},
{k:"vehicle",q:"What will you ride or drive?",n:"Bigger orders need bigger vehicles, so this helps us match you.",o:["Bicycle","Motorbike","Car","Van"],ack:"That helps a lot."},
{k:"time",q:"When can you ride?",n:"So we never call you for work you can’t do.",o:["Full time","Part time","Weekends only","Evenings only"],ack:"Noted. Nearly there."},
{k:"exp",q:"Have you delivered before?",n:"Optional. It’s a bonus, not a requirement.",t:"area",opt:1,ph:"One line is plenty, or skip this",ack:"Thanks. That’s every detail."},
{k:"ok",q:"Last one: is it OK if we contact you?",n:"We check your ID with you before your first delivery. Please don’t type any ID numbers here.",o:["Yes, that’s fine"],ack:"All done. Well finished."}];
var stage=document.getElementById("stage"),route=document.getElementById("route"),ix=-1,D={},saying="";
var rh="";for(var r=0;r<=S.length;r++){rh+="<i></i>"+(r<S.length?"<b></b>":"")}route.innerHTML=rh;
function prog(n){[].forEach.call(route.querySelectorAll("i"),function(e,i){e.classList.toggle("on",i<=n);e.classList.toggle("now",i===n&&n<S.length)});[].forEach.call(route.querySelectorAll("b"),function(e,i){e.classList.toggle("on",i<n)})}
var PILL=function(label,type,id){return '<button class="pill lg mono"'+(id?' id="'+id+'"':"")+' type="'+type+'">'+label+' <span class="dot"><svg class="i"><use href="#go"/></svg></span></button>'};
function render(){
  var h="";
  if(ix<0){prog(0);
    h='<div class="step"><h1>Ride<br>with Buzz.</h1><p class="why">Buzz sellers need people to carry orders to buyers. Sign up and we’ll contact you when riders are needed in your area. Seven short questions, one at a time. About two minutes.</p><div class="row" style="margin-top:0">'+PILL("Start","button","start")+'</div></div>'
  }else if(ix<S.length){var s=S[ix];prog(ix);
    h='<form class="step" novalidate><p class="say" aria-live="polite">'+esc(saying)+'</p><div class="cnt mono">Question '+(ix+1)+' of '+S.length+'</div><h1>'+esc(s.q)+'</h1><p class="why">'+esc(s.n)+'</p>';
    if(s.o)h+='<div class="opts">'+s.o.map(function(o){return '<button type="button" class="opt'+(D[s.k]===o?" sel":"")+'" data-v="'+esc(o)+'">'+esc(o)+'<svg class="i"><use href="#arrow"/></svg></button>'}).join("")+'</div>';
    else if(s.t==="area")h+='<textarea name="v" maxlength="400" placeholder="'+esc(s.ph)+'" aria-label="'+esc(s.q)+'">'+esc(D[s.k]||"")+'</textarea>';
    else h+='<input name="v" type="'+s.t+'" maxlength="120" placeholder="'+esc(s.ph)+'" value="'+esc(D[s.k]||"")+'" aria-label="'+esc(s.q)+'"'+(s.t==="tel"?' inputmode="tel" autocomplete="tel"':s.k==="name"?' autocomplete="name"':"")+'>';
    h+='<p class="msg" id="wm" aria-live="polite"></p><div class="row" style="margin-top:12px">'+(s.o?"":PILL(s.opt&&!D[s.k]?"Skip":"Continue","submit"))+(ix>0?'<button class="lnk mono" type="button" id="back">Back</button>':"")+'</div></form>'
  }else{prog(S.length);
    h='<div class="step"><h1>You’re all set, '+esc((D.name||"").split(" ")[0])+'.</h1><p class="why">We’ll contact you on <b>'+esc(D.phone)+'</b> when riders are needed in '+esc(D.area)+'. Keep your phone nearby.</p><dl class="dl"><div><dt>Area</dt><dd>'+esc(D.area)+'</dd></div><div><dt>Vehicle</dt><dd>'+esc(D.vehicle)+'</dd></div><div><dt>Availability</dt><dd>'+esc(D.time)+'</dd></div>'+(D.exp?'<div><dt>Experience</dt><dd>'+esc(D.exp)+'</dd></div>':"")+'</dl><p class="fine">Preview: your answers stay on this page. Nothing was sent or saved.</p><div class="row"><a class="pill lg mono" href="index.html">Back to home <span class="dot"><svg class="i"><use href="#go"/></svg></span></a><button class="lnk mono" type="button" id="again">Start again</button></div></div>'
  }
  stage.innerHTML=h;
  var f=stage.querySelector("input,textarea,#start");if(f)f.focus({preventScroll:true});
}
function advance(v){var s=S[ix];D[s.k]=v;saying=typeof s.ack==="function"?s.ack(v):s.ack;ix++;render()}
stage.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.id==="start"){ix=0;render()}
  else if(t.id==="back"){ix--;saying="Take your time.";render()}
  else if(t.id==="again"){D={};ix=-1;saying="";render()}
  else if(t.dataset.v){[].forEach.call(stage.querySelectorAll(".opt"),function(o){o.classList.toggle("sel",o===t)});var v=t.dataset.v;setTimeout(function(){advance(v)},260)}});
stage.addEventListener("submit",function(e){e.preventDefault();var s=S[ix],v=stage.querySelector("[name=v]").value.trim(),m=document.getElementById("wm");
  if(!v&&!s.opt){m.textContent="Please fill this in to continue.";return}
  if(s.t==="tel"&&v.replace(/\D/g,"").length<7){m.textContent="That number looks too short. Check it and try again.";return}
  advance(v)});
render();
})();
</script>
</body>
</html>
