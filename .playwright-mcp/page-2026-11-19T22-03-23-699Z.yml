    - region "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [ref=f3e10]:
      - generic [ref=f3e11]:
        - heading "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [level=1] [ref=f3e12]
        - paragraph [ref=f3e13]: Buzz is made by Aether Jade Innovation to fix those three things, in one app.
    - region "Three problems, three answers" [ref=f3e14]:
      - heading "Three problems, three answers" [level=2] [ref=f3e15]
      - list [ref=f3e16]:
        - listitem [ref=f3e17]:
          - generic [ref=f3e18]:
            - paragraph [ref=f3e19]: The problem
            - paragraph [ref=f3e20]: To chat with anyone, you had to hand over your phone number.
          - generic [ref=f3e21]:
            - paragraph [ref=f3e22]: Buzz ID and encryption
            - paragraph [ref=f3e23]: Buzz ID lets people reach you without it, and every chat is end-to-end encrypted.
        - listitem [ref=f3e24]:
          - generic [ref=f3e25]:
            - paragraph [ref=f3e26]: The problem
            - paragraph [ref=f3e27]: Paying a seller you'd never met meant hoping they'd deliver.
          - generic [ref=f3e28]:
            - paragraph [ref=f3e29]: Escrow
            - paragraph [ref=f3e30]: SunPay holds your money in escrow until you confirm the order arrived.
        - listitem [ref=f3e31]:
          - generic [ref=f3e32]:
            - paragraph [ref=f3e33]: The problem
            - paragraph [ref=f3e34]: News of danger nearby reached you late, if at all.
          - generic [ref=f3e35]:
            - paragraph [ref=f3e36]: EMBA alerts
            - paragraph [ref=f3e37]: EMBA alerts come from verified agencies and people near you, for the areas you choose.
    - region "What we believe" [ref=f3e38]:
