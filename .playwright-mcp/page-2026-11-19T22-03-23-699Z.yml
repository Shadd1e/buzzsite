        - heading "What we believe" [level=2] [ref=f3e40]
        - list [ref=f3e41]:
          - listitem [ref=f3e42]:
            - heading "One hub, not a pile of apps" [level=3] [ref=f3e43]
            - paragraph [ref=f3e44]: Chats, a marketplace, payments and safety work better when they're connected.
          - listitem [ref=f3e45]:
            - heading "Your number stays yours" [level=3] [ref=f3e46]
            - paragraph [ref=f3e47]: Privacy is the default. People reach you through your Buzz ID, not your phone number.
          - listitem [ref=f3e48]:
            - heading "Truth before polish" [level=3] [ref=f3e49]
            - paragraph [ref=f3e50]: We'd rather show a clear placeholder than make a claim we can't stand behind.
          - listitem [ref=f3e51]:
            - heading "Light enough for every phone" [level=3] [ref=f3e52]
            - paragraph [ref=f3e53]: Buzz should work well on a mid-range Android, on a slow or metered connection.
          - listitem [ref=f3e54]:
            - heading "Safety is a team effort" [level=3] [ref=f3e55]
            - paragraph [ref=f3e56]: "We work with verified agencies. Buzz is not an emergency service: in an emergency, call 112."
