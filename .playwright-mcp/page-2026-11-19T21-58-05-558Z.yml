  - main [ref=f15e26]:
    - region "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [ref=f15e27]:
      - generic [ref=f15e28]:
        - heading "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [level=1] [ref=f15e29]
        - paragraph [ref=f15e30]: Buzz is made by Aether Jade Innovation to fix those three things, in one app.
    - region "Three problems, three answers" [ref=f15e31]:
      - heading "Three problems, three answers" [level=2] [ref=f15e32]
      - list [ref=f15e33]:
        - listitem [ref=f15e34]:
          - generic [ref=f15e35]:
            - paragraph [ref=f15e36]: The problem
            - paragraph [ref=f15e37]: To chat with anyone, you had to hand over your phone number.
          - generic [ref=f15e38]:
            - paragraph [ref=f15e39]: Buzz ID and encryption
            - paragraph [ref=f15e40]: Buzz ID lets people reach you without it, and every chat is end-to-end encrypted.
        - listitem [ref=f15e41]:
          - generic [ref=f15e42]:
            - paragraph [ref=f15e43]: The problem
            - paragraph [ref=f15e44]: Paying a seller you'd never met meant hoping they'd deliver.
          - generic [ref=f15e45]:
            - paragraph [ref=f15e46]: Escrow
            - paragraph [ref=f15e47]: SunPay holds your money in escrow until you confirm the order arrived.
        - listitem [ref=f15e48]:
          - generic [ref=f15e49]:
            - paragraph [ref=f15e50]: The problem
            - paragraph [ref=f15e51]: News of danger nearby reached you late, if at all.
          - generic [ref=f15e52]:
            - paragraph [ref=f15e53]: EMBA alerts
            - paragraph [ref=f15e54]: EMBA alerts come from verified agencies and people near you, for the areas you choose.
    - region "What we believe" [ref=f15e55]:
      - generic [ref=f15e56]:
        - heading "What we believe" [level=2] [ref=f15e57]
        - list [ref=f15e58]:
          - listitem [ref=f15e59]:
            - heading "One hub, not a pile of apps" [level=3] [ref=f15e60]
            - paragraph [ref=f15e61]: Chats, a marketplace, payments and safety work better when they're connected.
          - listitem [ref=f15e62]:
            - heading "Your number stays yours" [level=3] [ref=f15e63]
            - paragraph [ref=f15e64]: Privacy is the default. People reach you through your Buzz ID, not your phone number.
          - listitem [ref=f15e65]:
            - heading "Truth before polish" [level=3] [ref=f15e66]
            - paragraph [ref=f15e67]: We'd rather show a clear placeholder than make a claim we can't stand behind.
          - listitem [ref=f15e68]:
            - heading "Light enough for every phone" [level=3] [ref=f15e69]
            - paragraph [ref=f15e70]: Buzz should work well on a mid-range Android, on a slow or metered connection.
          - listitem [ref=f15e71]:
            - heading "Safety is a team effort" [level=3] [ref=f15e72]
            - paragraph [ref=f15e73]: "We work with verified agencies. Buzz is not an emergency service: in an emergency, call 112."
