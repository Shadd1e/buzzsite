  - main [ref=f21e26]:
    - region "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [ref=f21e27]:
      - generic [ref=f21e28]:
        - heading "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [level=1] [ref=f21e29]
        - paragraph [ref=f21e30]: Buzz is made by Aether Jade Innovation to fix those three things, in one app.
    - region "Three problems, three answers" [ref=f21e31]:
      - heading "Three problems, three answers" [level=2] [ref=f21e32]
      - list [ref=f21e33]:
        - listitem [ref=f21e34]:
          - generic [ref=f21e35]:
            - paragraph [ref=f21e36]: The problem
            - paragraph [ref=f21e37]: To chat with anyone, you had to hand over your phone number.
          - generic [ref=f21e38]:
            - paragraph [ref=f21e39]: Buzz ID and encryption
            - paragraph [ref=f21e40]: Buzz ID lets people reach you without it, and every chat is end-to-end encrypted.
        - listitem [ref=f21e41]:
          - generic [ref=f21e42]:
            - paragraph [ref=f21e43]: The problem
            - paragraph [ref=f21e44]: Paying a seller you'd never met meant hoping they'd deliver.
          - generic [ref=f21e45]:
            - paragraph [ref=f21e46]: Escrow
            - paragraph [ref=f21e47]: SunPay holds your money in escrow until you confirm the order arrived.
        - listitem [ref=f21e48]:
          - generic [ref=f21e49]:
            - paragraph [ref=f21e50]: The problem
            - paragraph [ref=f21e51]: News of danger nearby reached you late, if at all.
          - generic [ref=f21e52]:
            - paragraph [ref=f21e53]: EMBA alerts
            - paragraph [ref=f21e54]: EMBA alerts come from verified agencies and people near you, for the areas you choose.
    - region "What we believe" [ref=f21e55]:
      - generic [ref=f21e56]:
        - heading "What we believe" [level=2] [ref=f21e57]
        - list [ref=f21e58]:
          - listitem [ref=f21e59]:
            - heading "One hub, not a pile of apps" [level=3] [ref=f21e60]
            - paragraph [ref=f21e61]: Chats, a marketplace, payments and safety work better when they're connected.
          - listitem [ref=f21e62]:
            - heading "Your number stays yours" [level=3] [ref=f21e63]
            - paragraph [ref=f21e64]: Privacy is the default. People reach you through your Buzz ID, not your phone number.
          - listitem [ref=f21e65]:
            - heading "Truth before polish" [level=3] [ref=f21e66]
            - paragraph [ref=f21e67]: We'd rather show a clear placeholder than make a claim we can't stand behind.
          - listitem [ref=f21e68]:
            - heading "Light enough for every phone" [level=3] [ref=f21e69]
            - paragraph [ref=f21e70]: Buzz should work well on a mid-range Android, on a slow or metered connection.
          - listitem [ref=f21e71]:
            - heading "Safety is a team effort" [level=3] [ref=f21e72]
            - paragraph [ref=f21e73]: "We work with verified agencies. Buzz is not an emergency service: in an emergency, call 112."
