  - main [ref=f23e26]:
    - region "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [ref=f23e27]:
      - generic [ref=f23e28]:
        - heading "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [level=1] [ref=f23e29]
        - paragraph [ref=f23e30]: Buzz is made by Aether Jade Innovation to fix those three things, in one app.
    - region "Three problems, three answers" [ref=f23e31]:
      - heading "Three problems, three answers" [level=2] [ref=f23e32]
      - list [ref=f23e33]:
        - listitem [ref=f23e34]:
          - generic [ref=f23e35]:
            - paragraph [ref=f23e36]: The problem
            - paragraph [ref=f23e37]: To chat with anyone, you had to hand over your phone number.
          - generic [ref=f23e38]:
            - paragraph [ref=f23e39]: Buzz ID and encryption
            - paragraph [ref=f23e40]: Buzz ID lets people reach you without it, and every chat is end-to-end encrypted.
        - listitem [ref=f23e41]:
          - generic [ref=f23e42]:
            - paragraph [ref=f23e43]: The problem
            - paragraph [ref=f23e44]: Paying a seller you'd never met meant hoping they'd deliver.
          - generic [ref=f23e45]:
            - paragraph [ref=f23e46]: Escrow
            - paragraph [ref=f23e47]: SunPay holds your money in escrow until you confirm the order arrived.
        - listitem [ref=f23e48]:
          - generic [ref=f23e49]:
            - paragraph [ref=f23e50]: The problem
            - paragraph [ref=f23e51]: News of danger nearby reached you late, if at all.
          - generic [ref=f23e52]:
            - paragraph [ref=f23e53]: EMBA alerts
            - paragraph [ref=f23e54]: EMBA alerts come from verified agencies and people near you, for the areas you choose.
    - region "What we believe" [ref=f23e55]:
      - generic [ref=f23e56]:
        - heading "What we believe" [level=2] [ref=f23e57]
        - list [ref=f23e58]:
          - listitem [ref=f23e59]:
            - heading "One hub, not a pile of apps" [level=3] [ref=f23e60]
            - paragraph [ref=f23e61]: Chats, a marketplace, payments and safety work better when they're connected.
          - listitem [ref=f23e62]:
            - heading "Your number stays yours" [level=3] [ref=f23e63]
            - paragraph [ref=f23e64]: Privacy is the default. People reach you through your Buzz ID, not your phone number.
          - listitem [ref=f23e65]:
            - heading "Truth before polish" [level=3] [ref=f23e66]
            - paragraph [ref=f23e67]: We'd rather show a clear placeholder than make a claim we can't stand behind.
          - listitem [ref=f23e68]:
            - heading "Light enough for every phone" [level=3] [ref=f23e69]
            - paragraph [ref=f23e70]: Buzz should work well on a mid-range Android, on a slow or metered connection.
          - listitem [ref=f23e71]:
            - heading "Safety is a team effort" [level=3] [ref=f23e72]
            - paragraph [ref=f23e73]: "We work with verified agencies. Buzz is not an emergency service: in an emergency, call 112."
