  - main [ref=f2e26]:
    - region "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [ref=f2e27]:
      - generic [ref=f2e28]:
        - heading "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [level=1] [ref=f2e29]
        - paragraph [ref=f2e30]: Buzz is made by Aether Jade Innovation to fix those three things, in one app.
    - region "Three problems, three answers" [ref=f2e31]:
      - heading "Three problems, three answers" [level=2] [ref=f2e32]
      - list [ref=f2e33]:
        - listitem [ref=f2e34]:
          - generic [ref=f2e35]:
            - paragraph [ref=f2e36]: The problem
            - paragraph [ref=f2e37]: To chat with anyone, you had to hand over your phone number.
          - generic [ref=f2e38]:
            - paragraph [ref=f2e39]: Buzz ID and encryption
            - paragraph [ref=f2e40]: Buzz ID lets people reach you without it, and every chat is end-to-end encrypted.
        - listitem [ref=f2e41]:
          - generic [ref=f2e42]:
            - paragraph [ref=f2e43]: The problem
            - paragraph [ref=f2e44]: Paying a seller you'd never met meant hoping they'd deliver.
          - generic [ref=f2e45]:
            - paragraph [ref=f2e46]: Escrow
            - paragraph [ref=f2e47]: SunPay holds your money in escrow until you confirm the order arrived.
        - listitem [ref=f2e48]:
          - generic [ref=f2e49]:
            - paragraph [ref=f2e50]: The problem
            - paragraph [ref=f2e51]: News of danger nearby reached you late, if at all.
          - generic [ref=f2e52]:
            - paragraph [ref=f2e53]: EMBA alerts
            - paragraph [ref=f2e54]: EMBA alerts come from verified agencies and people near you, for the areas you choose.
    - region "What we believe" [ref=f2e55]:
      - generic [ref=f2e56]:
        - heading "What we believe" [level=2] [ref=f2e57]
        - list [ref=f2e58]:
          - listitem [ref=f2e59]:
            - heading "One hub, not a pile of apps" [level=3] [ref=f2e60]
            - paragraph [ref=f2e61]: Chats, a marketplace, payments and safety work better when they're connected.
          - listitem [ref=f2e62]:
            - heading "Your number stays yours" [level=3] [ref=f2e63]
            - paragraph [ref=f2e64]: Privacy is the default. People reach you through your Buzz ID, not your phone number.
          - listitem [ref=f2e65]:
            - heading "Truth before polish" [level=3] [ref=f2e66]
            - paragraph [ref=f2e67]: We'd rather show a clear placeholder than make a claim we can't stand behind.
          - listitem [ref=f2e68]:
            - heading "Light enough for every phone" [level=3] [ref=f2e69]
            - paragraph [ref=f2e70]: Buzz should work well on a mid-range Android, on a slow or metered connection.
          - listitem [ref=f2e71]:
            - heading "Safety is a team effort" [level=3] [ref=f2e72]
            - paragraph [ref=f2e73]: "We work with verified agencies. Buzz is not an emergency service: in an emergency, call 112."
