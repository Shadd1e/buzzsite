  - main [ref=f18e26]:
    - region "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [ref=f18e27]:
      - generic [ref=f18e28]:
        - heading "Your number was everywhere. Paying a stranger was a gamble. Safety news came too late." [level=1] [ref=f18e29]
        - paragraph [ref=f18e30]: Buzz is made by Aether Jade Innovation to fix those three things, in one app.
    - region "Three problems, three answers" [ref=f18e31]:
      - heading "Three problems, three answers" [level=2] [ref=f18e32]
      - list [ref=f18e33]:
        - listitem [ref=f18e34]:
          - generic [ref=f18e35]:
            - paragraph [ref=f18e36]: The problem
            - paragraph [ref=f18e37]: To chat with anyone, you had to hand over your phone number.
          - generic [ref=f18e38]:
            - paragraph [ref=f18e39]: Buzz ID and encryption
            - paragraph [ref=f18e40]: Buzz ID lets people reach you without it, and every chat is end-to-end encrypted.
        - listitem [ref=f18e41]:
          - generic [ref=f18e42]:
            - paragraph [ref=f18e43]: The problem
            - paragraph [ref=f18e44]: Paying a seller you'd never met meant hoping they'd deliver.
          - generic [ref=f18e45]:
            - paragraph [ref=f18e46]: Escrow
            - paragraph [ref=f18e47]: SunPay holds your money in escrow until you confirm the order arrived.
        - listitem [ref=f18e48]:
          - generic [ref=f18e49]:
            - paragraph [ref=f18e50]: The problem
            - paragraph [ref=f18e51]: News of danger nearby reached you late, if at all.
          - generic [ref=f18e52]:
            - paragraph [ref=f18e53]: EMBA alerts
            - paragraph [ref=f18e54]: EMBA alerts come from verified agencies and people near you, for the areas you choose.
    - region "What we believe" [ref=f18e55]:
      - generic [ref=f18e56]:
        - heading "What we believe" [level=2] [ref=f18e57]
        - list [ref=f18e58]:
          - listitem [ref=f18e59]:
            - heading "One hub, not a pile of apps" [level=3] [ref=f18e60]
            - paragraph [ref=f18e61]: Chats, a marketplace, payments and safety work better when they're connected.
          - listitem [ref=f18e62]:
            - heading "Your number stays yours" [level=3] [ref=f18e63]
            - paragraph [ref=f18e64]: Privacy is the default. People reach you through your Buzz ID, not your phone number.
          - listitem [ref=f18e65]:
            - heading "Truth before polish" [level=3] [ref=f18e66]
            - paragraph [ref=f18e67]: We'd rather show a clear placeholder than make a claim we can't stand behind.
          - listitem [ref=f18e68]:
            - heading "Light enough for every phone" [level=3] [ref=f18e69]
            - paragraph [ref=f18e70]: Buzz should work well on a mid-range Android, on a slow or metered connection.
          - listitem [ref=f18e71]:
            - heading "Safety is a team effort" [level=3] [ref=f18e72]
            - paragraph [ref=f18e73]: "We work with verified agencies. Buzz is not an emergency service: in an emergency, call 112."
