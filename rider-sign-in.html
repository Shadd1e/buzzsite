<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzz Logistics – Rider sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5BFF}a:hover{color:#0B3FCC}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid #9DB8FF;outline-offset:2px}
</style>
</head>
<body>
<div style="font-family:Inter,system-ui,sans-serif;color:#0B1220;background:#F6F8FC;min-height:900px;box-sizing:border-box">
<header style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;max-width:1240px;margin:0 auto;padding:20px 32px">
<div style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em">Buzz <span style="font-weight:500;color:#4A5568">Logistics</span></div>
<nav style="display:flex;gap:28px;flex-wrap:wrap;font-size:15px;font-weight:500">
<a href="#" style="color:#0B1220;text-decoration:none">Track a parcel</a>
<a href="#" style="color:#0B1220;text-decoration:none">How it works</a>
<a href="#" style="color:#0B1220;text-decoration:none">Coverage</a>
<a href="#" style="color:#0B1220;text-decoration:none">Partners</a>
</nav>
<div style="display:flex;gap:12px">
<a href="#" style="min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;padding:0 20px;border-radius:999px;border:1px solid #CBD5E6;color:#0B1220;text-decoration:none;font-weight:500;font-size:15px">Sign in</a>
<a href="#" style="min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;padding:0 20px;border-radius:999px;background:#1F5BFF;color:#fff;text-decoration:none;font-weight:600;font-size:15px">Join the waitlist</a>
</div>
</header>

<main style="max-width:1240px;margin:0 auto;padding:24px 32px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:32px;align-items:stretch">

<section style="background:#fff;border:1px solid #E1E7F2;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:28px">
<div>
<h1 style="margin:0 0 12px;font-family:'Space Grotesk',sans-serif;font-size:48px;line-height:1.05;letter-spacing:-0.03em;font-weight:600">Rider sign in</h1>
<p style="margin:0;font-size:17px;line-height:1.5;color:#4A5568">See your deliveries, batches and earnings.</p>
</div>

<div role="group" aria-label="How do you ride?" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#EEF2FA;border-radius:14px">
<button type="button" aria-pressed="false" style="min-height:48px;border:0;border-radius:11px;background:transparent;color:#2D3748;font:500 15px Inter,sans-serif;cursor:pointer">I ride with a partner</button>
<button type="button" aria-pressed="true" style="min-height:48px;border:0;border-radius:11px;background:#fff;color:#0B1220;font:600 15px Inter,sans-serif;box-shadow:0 1px 3px rgba(11,18,32,.15);cursor:pointer">I ride on my own</button>
</div>

<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-direction:column;gap:8px">
<label for="code" style="font-size:14px;font-weight:600">Rider code</label>
<input id="code" type="text" placeholder="BZL-I-000000" autocomplete="username" style="height:52px;box-sizing:border-box;padding:0 16px;border:1px solid #AEB9CE;border-radius:12px;font:400 16px Inter,sans-serif;color:#0B1220">
<span style="font-size:13px;color:#4A5568">Starts with BZL-I-</span>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label for="pw" style="font-size:14px;font-weight:600">Password</label>
<div style="position:relative">
<input id="pw" type="password" autocomplete="current-password" style="width:100%;height:52px;box-sizing:border-box;padding:0 56px 0 16px;border:1px solid #AEB9CE;border-radius:12px;font:400 16px Inter,sans-serif;color:#0B1220">
<button type="button" aria-label="Show password" style="position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D3748" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
<button type="button" style="min-height:52px;padding:0 36px;border:0;border-radius:999px;background:#1F5BFF;color:#fff;font:600 16px Inter,sans-serif;cursor:pointer">Sign in</button>
<a href="#" style="font-size:15px;font-weight:500">Forgot your password?</a>
</div>

<div style="display:flex;align-items:center;gap:16px;color:#4A5568;font-size:13px"><span style="flex:1;height:1px;background:#E1E7F2"></span>or<span style="flex:1;height:1px;background:#E1E7F2"></span></div>
<button type="button" style="min-height:52px;width:100%;border:1.5px solid #0B1220;border-radius:999px;background:#fff;color:#0B1220;font:600 16px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1220" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Sign in with Buzz ID</button>

<p style="margin:0;padding-top:20px;border-top:1px solid #E1E7F2;font-size:14px;color:#4A5568">Partner staff? <a href="#" style="font-weight:600">Sign in here</a></p>
</section>

<section aria-label="Buzz rider on a delivery" style="position:relative;border-radius:24px;overflow:hidden;background:#1F5BFF;min-height:560px">
<svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" role="img" aria-label="Illustration of a rider on a motorbike carrying parcels" style="position:absolute;inset:0"><rect width="400" height="520" fill="#1F5BFF"/><circle cx="310" cy="110" r="60" fill="#4F85FF"/><rect y="400" width="400" height="120" fill="#0B1B3F"/><circle cx="120" cy="390" r="50" fill="#0B1220" stroke="#fff" stroke-width="8"/><circle cx="290" cy="390" r="50" fill="#0B1220" stroke="#fff" stroke-width="8"/><path d="M120 390L170 320H250L290 390M170 320L200 280H235" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="290" width="84" height="64" rx="8" fill="#F6B73C"/><path d="M60 316H144" stroke="#C98A12" stroke-width="6"/><circle cx="205" cy="190" r="24" fill="#FFD9B3"/><path d="M185 170a22 22 0 0 1 42 0z" fill="#0B1220"/><path d="M180 220h50l14 70-36 30-34-30z" fill="#fff"/><path d="M232 232l36 40" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>
<span style="position:absolute;left:24px;bottom:24px;background:#fff;color:#0B1220;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600">Ride on your own schedule</span></section>

</main>
</div>
</body>
</html>
